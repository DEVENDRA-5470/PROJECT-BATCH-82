name: Multi EC2 SSM Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-east-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: AWS Login via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::720800607391:role/github-action-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Send command to ALL tagged instances
        id: send
        run: |
          CMD_ID=$(aws ssm send-command \
            --targets "Key=tag:App,Values=flask" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":[
              "echo Hostname: $(hostname)",
              "echo Private-IP: $(hostname -I)",
              "echo Uptime: $(uptime -p)",
              "echo Disk: $(df -h / | tail -1)",
              "echo Memory: $(free -h | grep Mem)"
            ]}' \
            --query 'Command.CommandId' --output text)
          echo "cmd_id=$CMD_ID" >> $GITHUB_OUTPUT

      - name: Generate log.txt
        run: |
          sleep 15

          # Fail-fast: agar koi instance target nahi hua toh job RED ho
          COUNT=$(aws ssm list-command-invocations \
            --command-id "${{ steps.send.outputs.cmd_id }}" \
            --query "length(CommandInvocations)" --output text)

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No instances matched tag App=flask — check tags!"
            exit 1
          fi

          {
            echo "=================================================="
            echo " DEPLOYMENT LOG - Run #${{ github.run_number }}"
            echo " Date: $(date)"
            echo " Triggered by: ${{ github.actor }}"
            echo " Instances targeted: $COUNT"
            echo "=================================================="
            echo ""
            aws ssm list-command-invocations \
              --command-id "${{ steps.send.outputs.cmd_id }}" \
              --details \
              --query "CommandInvocations[*].{Instance:InstanceId,Status:Status,Output:CommandPlugins[0].Output}" \
              --output table
          } > log.txt

          cat log.txt

      - name: Commit log.txt to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add log.txt
          git diff --staged --quiet || git commit -m "Update deployment log - Run #${{ github.run_number }}"
          git push

name: Multi EC2 SSM Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: AWS Login via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::720800607391:role/github-action-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Send command to ALL tagged instances
        id: send
        run: |
          CMD_ID=$(aws ssm send-command \
            --targets "Key=tag:App,Values=flask" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":[
              "echo Hostname: $(hostname)",
              "echo Private-IP: $(hostname -I)",
              "echo Uptime: $(uptime -p)",
              "echo Disk: $(df -h / | tail -1)",
              "echo Memory: $(free -h | grep Mem)"
            ]}' \
            --query 'Command.CommandId' --output text)
          echo "cmd_id=$CMD_ID" >> $GITHUB_OUTPUT

      - name: Generate log.txt with all EC2 details
        run: |
          sleep 15

          echo "==================================================" > log.txt
          echo " DEPLOYMENT LOG - Run #${{ github.run_number }}"   >> log.txt
          echo " Date: $(date)"                                    >> log.txt
          echo " Triggered by: ${{ github.actor }}"                >> log.txt
          echo " Repo: ${{ github.repository }}"                   >> log.txt
          echo "==================================================" >> log.txt
          echo ""                                                   >> log.txt

          # Har instance ka detail nikalo aur log mein daalo
          for INSTANCE in $(aws ssm list-command-invocations \
              --command-id "${{ steps.send.outputs.cmd_id }}" \
              --query "CommandInvocations[*].InstanceId" --output text); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ steps.send.outputs.cmd_id }}" \
              --instance-id "$INSTANCE" \
              --query 'Status' --output text)

            OUTPUT=$(aws ssm get-command-invocation \
              --command-id "${{ steps.send.outputs.cmd_id }}" \
              --instance-id "$INSTANCE" \
              --query 'StandardOutputContent' --output text)

            echo "---------- Instance: $INSTANCE ----------" >> log.txt
            echo "Command Status: $STATUS"                    >> log.txt
            echo "$OUTPUT"                                     >> log.txt
            echo ""                                            >> log.txt
          done

          echo "=========== END OF LOG ===========" >> log.txt

          # Console mein bhi dikhao
          cat log.txt

      - name: Upload log.txt as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ec2-deployment-log-run-${{ github.run_number }}
          path: log.txt
